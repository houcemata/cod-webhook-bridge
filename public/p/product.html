  const base=Array.isArray(product.images)?product.images:(product.images?[product.images]:[]);
  const variantImages=variants().map(v=>v.image).filter(Boolean);
  return [...new Set([...base,...variantImages])];
}
function variants(){
  const raw=product.variants;let list=[];
  if(Array.isArray(raw))list=raw;
  else if(raw&&typeof raw==='object')list=Object.entries(raw).map(([name,val])=>typeof val==='object'?{name,...val}:{name,price:val});
  if(!list.length)list=[{name:'Standard',label:'Standard',price:product.price}];
  return list.map(v=>({name:v.name||v.label||v.value||'Standard',label:v.label||v.name||v.value||'Standard',price:Number(v.price||product.price),stock:v.stock,image:v.image||'',options:v.options||null}));
}
function optionGroups(){
  const groups={};
  variants().forEach(v=>{
    if(!v.options)return;
    Object.entries(v.options).forEach(([name,value])=>{
      if(!groups[name])groups[name]=[];
      if(value&&!groups[name].includes(value))groups[name].push(value);
    });
  });
  return groups;
}
function hasOptionGroups(){return Object.keys(optionGroups()).length>0;}
function setDefaultOptions(){const first=variants()[0];selectedOptions=first?.options?{...first.options}:{};}
function findSelectedVariant(){
  if(!hasOptionGroups())return variant||variants()[0];
  return variants().find(v=>v.options&&Object.entries(selectedOptions).every(([name,value])=>v.options[name]===value))||variants()[0];
}
function renderVariantControls(){
  if(!hasOptionGroups()){
    return `<div class="choices" id="variant-choices">${variants().map((v,i)=>`<button class="choice ${i===0?'active':''}" onclick="selectVariant(${i},this)"><strong>${esc(v.label)}</strong><span>${money(v.price)}</span></button>`).join('')}</div>`;
  }
  const groups=optionGroups();
  return Object.entries(groups).map(([name,values])=>`
    <div class="option-group">
      <div class="option-title">${esc(name)}</div>
      <div class="choices">${values.map(value=>`<button class="choice ${selectedOptions[name]===value?'active':''}" onclick="selectOption('${enc(name)}','${enc(value)}',this)"><strong>${esc(value)}</strong></button>`).join('')}</div>
    </div>`).join('');
}
async function loadProduct(){
  const slug=slugFromPath();if(!slug){missing();return;}
  try{
    const res=await fetch(`${SB_URL}/products?select=*&slug=eq.${encodeURIComponent(slug)}&active=eq.true&limit=1`,{headers:H});
    if(!res.ok)throw new Error(await res.text());
    const data=await res.json();if(!data[0]){missing();return;}
    product=data[0];variant=variants()[0];setDefaultOptions();render();
    if(window.ARCOMeta){
      window.ARCOMeta.trackViewContent({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:Number(variant.price||product.price||0),currency:'DZD'});
    }
    if(window.ARCOTikTok){
      window.ARCOTikTok.trackViewContent({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:Number(variant.price||product.price||0),currency:'DZD'});
    }
  }catch(e){document.getElementById('app').innerHTML='<div class="missing">تعذر تحميل المنتج.</div>';}
}
function missing(){document.getElementById('app').innerHTML='<div class="missing">هذا المنتج غير متوفر حاليا.</div>';}
function render(){
  const imgs=images();document.title=product.name+' - ARCO';
  document.getElementById('app').innerHTML=`
    <header class="topbar"><a class="brand" href="/">ARCO</a><a class="back" href="/">Products</a></header>
    <section class="product-layout">
      <div class="gallery">
        <div class="main-img">${imgs[0]?`<img id="main-img" src="${esc(imgs[0])}" alt="${esc(product.name)}">`:''}</div>
        ${imgs.length>1?`<div class="thumbs">${imgs.map((img,i)=>`<button class="thumb ${i===0?'active':''}" onclick="setImage(this,'${esc(img)}')"><img src="${esc(img)}" alt=""></button>`).join('')}</div>`:''}
      </div>
      <div class="panel">
        <div class="kicker">ARCO - COD Algeria</div>
        <h1>${esc(product.name)}</h1>
        <div class="desc">${esc(product.description_ar||product.description_fr||'Poster premium disponible avec paiement à la livraison.')}</div>
        <div class="price-row">${product.original_price?`<span class="old">${money(product.original_price)}</span>`:''}<span class="price" id="base-price">${money(variant.price)}</span></div>
        <div class="block">
          <div class="label">الموديل / المقاس <span class="hint">Choisir une option</span></div>
          ${renderVariantControls()}
        </div>
        <div class="block" id="order">
          <div class="label">معلومات الطلب <span class="hint">Paiement à la livraison</span></div>
          <div class="form">
            <label class="field"><span>الاسم الكامل</span><input id="f-name" autocomplete="name"></label>
            <label class="field"><span>رقم الهاتف</span><input id="f-phone" inputmode="tel" placeholder="05xxxxxxxx"></label>
            <label class="field"><span>الولاية</span><select id="f-wilaya" onchange="onWilayaChange()"><option value="">اختر الولاية</option>${WILAYAS.map(w=>`<option value="${w[0]}|${esc(w[1])}">${w[0]} - ${esc(w[1])}</option>`).join('')}</select></label>
            <div class="choices"><button class="choice active" onclick="selectDelivery(event,'home')"><strong>توصيل للمنزل</strong><span id="home-price">اختر الولاية</span></button><button class="choice" onclick="selectDelivery(event,'pickup')"><strong>Stop Desk</strong><span id="desk-price">اختر الولاية</span></button></div>
            <label class="field" id="commune-wrap"><span>البلدية</span><select id="f-commune"><option value="">اختر البلدية</option></select></label>
            <label class="field" id="desk-wrap" style="display:none"><span>نقطة Stop Desk</span><select id="f-desk" onchange="selectedDesk=this.value"><option value="">اختر النقطة</option></select></label>
          </div>
          <div class="summary"><div class="sum-row"><span>المنتج</span><strong id="sum-product">${money(variant.price)}</strong></div><div class="sum-row"><span>التوصيل</span><strong id="sum-ship">0 DZD</strong></div><div class="sum-row total"><span>المجموع</span><strong id="sum-total">${money(variant.price)}</strong></div></div>
          <button class="order-btn" id="order-btn" onclick="submitOrder()">اطلب الآن</button>
        </div>
      </div>
    </section>`;
  updateTotals();
  bindDraftCapture();
}
function bindDraftCapture(){if(draftCaptureBound||!window.ARCODraft||!product)return;draftCaptureBound=window.ARCODraft.bindDraftCapture({phoneInputId:'f-phone',watchInputIds:['f-name','f-phone','f-wilaya','f-commune','f-desk'],buildPayload:()=>({product_slug:product.slug,name:document.getElementById('f-name')?.value||'',phone:document.getElementById('f-phone')?.value||'',wilaya:document.getElementById('f-wilaya')?.value.split('|')[1]||'',wilaya_id:Number((document.getElementById('f-wilaya')?.value||'').split('|')[0]||0)||0,commune:document.getElementById('f-commune')?.value||'',delivery_type:delivery,station_code:delivery==='pickup'?selectedDesk:null,variant_label:variant?.label||variant?.name||'Standard',selected_options:selectedOptions,product_name:product.name,shipping_cost:shippingCost(),notes:'draft lead'})});}
function setImage(btn,src){document.querySelectorAll('.thumb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('main-img').src=src;}
function selectVariant(i,btn){variant=variants()[i];document.querySelectorAll('#variant-choices .choice').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(variant.image&&document.getElementById('main-img'))document.getElementById('main-img').src=variant.image;updateTotals();window.ARCODraft?.triggerCapture?.();}
function selectOption(name,value,btn){name=decodeURIComponent(name);value=decodeURIComponent(value);selectedOptions[name]=value;variant=findSelectedVariant();btn.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(variant.image&&document.getElementById('main-img'))document.getElementById('main-img').src=variant.image;updateTotals();window.ARCODraft?.triggerCapture?.();}
function selectDelivery(ev,type){ev.preventDefault();delivery=type;selectedDesk='';ev.currentTarget.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));ev.currentTarget.classList.add('active');document.getElementById('commune-wrap').style.display=type==='home'?'grid':'none';document.getElementById('desk-wrap').style.display=type==='pickup'?'grid':'none';if(type==='pickup')loadDesks();updateTotals();window.ARCODraft?.triggerCapture?.();}
async function onWilayaChange(){
  const val=document.getElementById('f-wilaya').value;if(!val)return;selectedDesk='';
  const id=val.split('|')[0];
  populateCommunes(id);
  const res=await fetch(`${SB_URL}/shipping_rates?wilaya_id=eq.${Number(id)}&select=home_delivery,stop_desk&limit=1`,{headers:H});
  const data=await res.json();shipping=data[0]||{home_delivery:0,stop_desk:0};
  document.getElementById('home-price').textContent=money(shipping.home_delivery);
  document.getElementById('desk-price').textContent=money(shipping.stop_desk);
  if(delivery==='pickup')loadDesks();updateTotals();window.ARCODraft?.triggerCapture?.();
}
function populateCommunes(wilayaId){
  const sel=document.getElementById('f-commune');if(!sel)return;
  const communes=WILAYA_COMMUNES[String(wilayaId).padStart(2,'0')]||[];
  sel.innerHTML='<option value="">اختر البلدية</option>'+communes.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('');
}
async function loadDesks(){
  const sel=document.getElementById('f-desk');if(!sel)return;
  if(!desks){try{const r=await fetch('/api/noest-desks');if(r.ok)desks=await r.json();}catch(e){}}
  const id=(document.getElementById('f-wilaya').value||'').split('|')[0];
  const entries=Object.entries(desks||{}).filter(([code])=>id&&new RegExp('^'+id+'[A-Z]').test(code));
  sel.innerHTML='<option value="">اختر النقطة</option>'+entries.map(([code,d])=>`<option value="${code}">${esc(d.name||code)}</option>`).join('');
}
function shippingCost(){return delivery==='home'?Number(shipping.home_delivery||0):Number(shipping.stop_desk||0);}
function total(){return Number(variant.price||0)+shippingCost();}
function updateTotals(){['sum-product','base-price'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=money(variant.price)});const s=document.getElementById('sum-ship'),t=document.getElementById('sum-total'),st=document.getElementById('sticky-total'),sticky=document.getElementById('sticky');if(s)s.textContent=money(shippingCost());if(t)t.textContent=money(total());if(st)st.textContent=money(total());if(sticky)sticky.classList.toggle('visible',!!product);}
function scrollToOrder(){document.getElementById('order').scrollIntoView({behavior:'smooth'});}
function trackProductCheckout(){
  if(checkoutTracked||!window.ARCOMeta||!product)return;
  checkoutTracked=true;
  window.ARCOMeta.trackInitiateCheckout({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD'});
  if(window.ARCOTikTok){
    window.ARCOTikTok.trackInitiateCheckout({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD'});
  }
}
async function submitOrder(){
  const name=document.getElementById('f-name').value.trim(),phone=document.getElementById('f-phone').value.replace(/\s/g,''),wilayaVal=document.getElementById('f-wilaya').value,commune=document.getElementById('f-commune').value.trim();
  if(!name)return toast('ادخل الاسم',true);
  if(!/^0[567]\d{8}$/.test(phone))return toast('رقم الهاتف غير صحيح',true);
  if(!wilayaVal)return toast('اختر الولاية',true);
  if(!shippingCost())return toast('اختر ولاية متوفرة',true);
  if(delivery==='home'&&!commune)return toast('اختر البلدية',true);
  if(delivery==='pickup'&&!selectedDesk)return toast('اختر نقطة Stop Desk',true);
  trackProductCheckout();
  const [wilayaId,wilaya]=wilayaVal.split('|'),btn=document.getElementById('order-btn');
  btn.classList.add('loading');btn.textContent='جاري الإرسال...';
  const payload={product_slug:product.slug,name,phone,wilaya,wilaya_id:Number(wilayaId),commune:delivery==='home'?commune:'',delivery_type:delivery==='home'?'home':'pickup',station_code:delivery==='pickup'?selectedDesk:null,variant_label:variant.label,selected_options:selectedOptions,event_source_url:location.href,draft_order_id:(window.ARCODraft?.getStoredDraftId({product_slug:product.slug,phone,variant_label:variant?.label||variant?.name||'Standard',delivery_type:delivery})||undefined)};
  try{
    const r=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const result=await r.json().catch(()=>({}));
    if(!r.ok||!result.ok)throw new Error(result.error||'failed');
    if(window.ARCOMeta){
      window.ARCOMeta.trackPurchase({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD',eventID:result.order_id});
    }
    if(window.ARCOTikTok){
      window.ARCOTikTok.trackPurchase({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD',eventID:result.order_id});
    }
    if(window.ARCODraft){window.ARCODraft.clearStoredDraftId({product_slug:product.slug,phone,variant_label:variant?.label||variant?.name||'Standard',delivery_type:delivery});}
    document.getElementById('success-id').textContent='#'+result.order_id;document.getElementById('success').classList.add('show');
  }catch(e){btn.classList.remove('loading');btn.textContent='اطلب الآن';toast('حدث خطأ. حاول مرة أخرى',true);}
}
let tt;function toast(msg,err=false){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>el.className='toast',2600);}
loadProduct();
</script>
</body>
