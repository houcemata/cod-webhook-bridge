<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />

<title>ARCO Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;700;900&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">

<script src="/tiktok-pixel.js"></script>

<style>
:root{--yellow:#F5C500;--black:#080808;--dark:#111;--line:rgba(255,255,255,.12);--muted:#aaa;--red:#e11d48;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--black);color:#fff;font-family:'Cairo',sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(245,197,0,.13),transparent 290px),radial-gradient(circle at 50% 0,rgba(245,197,0,.14),transparent 38%);z-index:-1}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{width:min(1160px,100%);margin:0 auto;padding:18px 18px 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;direction:ltr;padding-bottom:24px}
.brand{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:5px;color:var(--yellow);text-decoration:none}
.brand img{height:34px;width:auto;display:block}
.back{color:#ddd;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px}
.product-layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:28px;align-items:start;direction:ltr}
.gallery{position:sticky;top:18px}.main-img{aspect-ratio:4/5;background:#131313;border:1px solid var(--line);border-radius:8px;overflow:hidden}.main-img img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.thumb{aspect-ratio:1;border:1px solid var(--line);border-radius:5px;background:#151515;overflow:hidden}.thumb.active{border-color:var(--yellow)}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.panel{direction:rtl}.kicker{font-family:'Barlow Condensed',sans-serif;color:var(--yellow);font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;direction:ltr;text-align:right}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(54px,9vw,96px);line-height:.88;letter-spacing:2px;direction:ltr;text-align:right}
.desc{color:#d7d7d7;line-height:1.9;margin:16px 0 18px;font-size:16px}.price-row{display:flex;align-items:center;gap:12px;justify-content:flex-start;direction:ltr;margin-bottom:20px}
.price{font-family:'Bebas Neue',sans-serif;color:var(--yellow);font-size:46px;letter-spacing:1px}.old{font-family:'Barlow Condensed',sans-serif;color:#777;text-decoration:line-through;font-size:24px}
.block{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:900;margin-bottom:10px}.hint{font-size:12px;color:var(--muted);font-weight:600}
.option-group{margin-top:12px}.option-group:first-child{margin-top:0}.option-title{font-weight:900;margin-bottom:8px;color:#ddd}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{border:1px solid var(--line);background:#111;color:#fff;border-radius:6px;padding:12px;text-align:right}.choice.active{border-color:var(--yellow);box-shadow:inset 0 0 0 1px rgba(245,197,0,.5)}.choice strong{display:block}.choice span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.form{display:grid;gap:10px}.field{display:grid;gap:6px}.field span{font-size:13px;color:#ddd;font-weight:700}.field input,.field select,.field textarea{width:100%;background:#111;color:#fff;border:1px solid var(--line);border-radius:5px;padding:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--yellow)}.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,.choice:focus-visible,.order-btn:focus-visible,.sticky button:focus-visible,.thumb:focus-visible,.rcard:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
.summary{display:grid;gap:8px;background:#101010;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:14px}.sum-row{display:flex;align-items:center;justify-content:space-between;gap:14px;color:#d2d2d2}.sum-row.total{border-top:1px solid var(--line);padding-top:9px;color:#fff;font-weight:900}
.order-btn{width:100%;border:0;background:var(--yellow);color:var(--black);font-weight:900;border-radius:6px;padding:15px;margin-top:14px;min-height:56px}.order-btn.loading{opacity:.7;pointer-events:none}.bundle-primary{background:var(--yellow)!important;color:var(--black)!important;margin-top:14px!important}.single-order-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:#bbb;font-size:.88rem;min-height:46px;margin-top:8px}.single-order-btn:hover{border-color:rgba(255,255,255,.5);color:#fff}.offer-note{margin-top:8px;color:#aaa;font-size:.78rem;line-height:1.55;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#181818;color:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 18px;z-index:30;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.toast.err{border-color:rgba(225,29,72,.7)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(8,8,8,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:20;direction:ltr}.sticky>div:first-child{min-width:0;flex:0 1 42%}.sticky strong{color:var(--yellow);font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px}.sticky-actions{display:flex;align-items:stretch;flex:1;min-width:0;gap:8px;direction:ltr}.sticky-actions .sticky-cta{flex:1;min-width:0;background:var(--yellow);color:var(--black);border:0;border-radius:5px;padding:11px 18px;font-weight:900;white-space:nowrap}.sticky-cart{position:relative;flex:0 0 58px;width:58px;height:56px;background:#111;color:var(--yellow);border:1px solid rgba(245,197,0,.55);border-radius:5px;font-size:25px;line-height:1}.sticky-cart-badge{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font:700 12px/1 'Cairo',sans-serif;min-width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px}.sticky-cart-badge.zero{display:none}
@media(max-width:860px){body #arco-cart-fab{display:none!important}}
.success{position:fixed;inset:0;background:rgba(8,8,8,.96);z-index:40;display:none;place-items:center;padding:22px;text-align:center}.success.show{display:grid}.success-box{max-width:460px}.success h2{font-family:'Bebas Neue',sans-serif;color:var(--yellow);font-size:58px;letter-spacing:2px}.success p{line-height:1.8;color:#ddd;margin-top:10px}.success a{display:inline-block;margin-top:20px;background:var(--yellow);color:#080808;text-decoration:none;font-weight:900;padding:12px 18px;border-radius:5px}
.success-icon{font-size:52px;margin-bottom:6px}
.success-call-note{color:var(--muted);font-size:13px;margin-top:14px}
.success-phone-wrap{margin-top:10px;display:grid;justify-items:center;gap:6px}
.success-phone-btn{background:var(--yellow);color:#080808;border:0;border-radius:8px;padding:13px 22px;font-weight:900;font-size:18px;letter-spacing:1px;cursor:pointer;font-family:'Cairo',sans-serif}
.success-copy-hint{color:var(--muted);font-size:12px}
.success-copy-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#181818;color:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 18px;z-index:50;opacity:0;pointer-events:none;transition:.2s}
.success-copy-toast.show{opacity:1}
.loader,.missing{min-height:60vh;display:grid;place-items:center;text-align:center;color:#ddd}
/* STAT HERO */
.prod-stat{text-align:center;padding:22px 0 14px;border-bottom:1px solid var(--line)}
.prod-stat-num{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.6rem,8vw,4.4rem);color:var(--yellow);line-height:1;letter-spacing:-.02em}
.prod-stat-lbl{font-family:'Cairo',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:0;color:#888;margin-top:5px}
.prod-stat-sub{color:rgba(255,255,255,.6);font-size:.9rem;line-height:1.6;margin-top:8px;max-width:400px;margin-inline:auto}
.prod-stat.offer-stat{padding:18px 0 14px}
.offer-stat .offer-headline{font-family:'Cairo',sans-serif;font-size:clamp(1.35rem,5vw,2rem);font-weight:900;line-height:1.55;color:var(--yellow);text-wrap:balance}
.offer-stat .offer-sub{font-family:'Cairo',sans-serif;color:#e7e7e7;font-size:.92rem;font-weight:700;line-height:1.7;margin-top:4px}
.offer-stat .prod-stat-lbl{font-size:.78rem;color:#888;margin-top:8px}
.product-offer-main{margin:0 14px;padding:18px 16px;border:1px solid rgba(245,197,0,.36);border-radius:16px;background:linear-gradient(135deg,rgba(245,197,0,.14),rgba(245,197,0,.035));box-shadow:0 10px 28px rgba(0,0,0,.16)}
.product-offer-headline{font-family:'Cairo',sans-serif;font-size:clamp(1.1rem,4.5vw,1.7rem);font-weight:900;line-height:1.45;color:var(--yellow);text-wrap:balance}
.product-offer-sub{margin-top:6px;font-family:'Cairo',sans-serif;font-size:.84rem;font-weight:700;line-height:1.6;color:#eee}
.product-offer-trust{margin-top:12px;font-family:'Cairo',sans-serif;font-size:1.35rem;font-weight:900;line-height:1;color:var(--yellow)}
.product-promos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.product-promo{min-height:54px;padding:9px 8px;border:1px solid var(--line);border-radius:11px;background:rgba(8,8,8,.42);display:grid;align-content:center;gap:2px;font-family:'Cairo',sans-serif;font-size:.72rem;font-weight:700;line-height:1.35;color:#eee}
.product-promo strong{color:var(--yellow);font-size:.78rem}
.product-promo span{color:rgba(255,255,255,.7)}
@media(max-width:520px){.product-offer-main{margin:0 8px;padding:15px 12px}.product-offer-headline{font-size:1.08rem}.product-offer-sub{font-size:.75rem}.product-promo{min-height:48px;font-size:.68rem}}
/* TRUST BADGES */
.trust-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 0}
.trust-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid rgba(245,197,0,.28);border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.06em;color:var(--yellow);background:rgba(245,197,0,.06)}
/* UPSELL BANNER */
.upsell-banner{background:rgba(245,197,0,.07);border:1px solid rgba(245,197,0,.22);border-radius:10px;padding:12px 14px;margin-top:14px;text-align:center}
.upsell-banner p{font-family:'Cairo',sans-serif;font-size:.88rem;color:#ddd;line-height:1.6}.upsell-banner .offer-saving{display:block;margin-top:4px;color:#8ff0ae;font-size:.8rem;font-weight:700;line-height:1.85}.upsell-banner .offer-line{display:block}
.upsell-banner strong{color:var(--yellow)}
/* RELATED PRODUCTS */
.related-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.related-title{font-family:'Cairo',sans-serif;font-size:1.45rem;font-weight:900;letter-spacing:0;color:var(--yellow);margin-bottom:14px}
.related-rail{display:flex;gap:11px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.related-rail::-webkit-scrollbar{display:none}
.rcard{flex-shrink:0;width:150px;border-radius:12px;overflow:hidden;background:#111;border:1px solid var(--line);text-decoration:none;color:#fff;transition:.2s}
.rcard:hover{border-color:rgba(245,197,0,.4);transform:translateY(-4px)}
.rcard-img{aspect-ratio:4/5;overflow:hidden;background:#1a1a1a}
.rcard-img img{width:100%;height:100%;object-fit:cover;display:block}
.rcard-info{padding:8px 10px}
.rcard-name{font-family:'Cairo',sans-serif;font-size:.8rem;font-weight:700;line-height:1.45;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-price{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--yellow)}
/* TESTIMONIALS */
.prod-testi{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.prod-section-title{font-family:'Cairo',sans-serif;font-size:1.5rem;font-weight:900;letter-spacing:0;color:var(--yellow);margin-bottom:16px;text-align:center}
.prod-section-sub{font-family:'Cairo',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:0;color:#888;text-align:center;margin-top:-10px;margin-bottom:16px}
.testi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{border-radius:12px;overflow:hidden;background:#111;border:1px solid var(--line)}
.tcard img{width:100%;height:auto;display:block}
/* WHY */
.prod-why{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.why-grid-p{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.why-card-p{background:#111;border:1px solid var(--line);border-radius:12px;padding:14px}
.why-card-p .why-ic{width:36px;height:36px;background:rgba(245,197,0,.1);border-radius:8px;display:grid;place-items:center;margin-bottom:10px}
.why-card-p .why-ic svg{width:18px;height:18px;stroke:var(--yellow);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.why-card-p h3{font-family:'Cairo',sans-serif;font-weight:900;font-size:.9rem;margin-bottom:5px;color:#fff}
.why-card-p p{font-family:'Cairo',sans-serif;font-size:.8rem;color:#999;line-height:1.7}
/* HOW */
.prod-how{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.how-grid-p{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.how-step-p{background:#111;border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}
.how-num-p{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:rgba(245,197,0,.25);line-height:1;margin-bottom:6px}
.how-step-p h3{font-family:'Cairo',sans-serif;font-weight:900;font-size:.88rem;margin-bottom:4px}
.how-step-p p{font-family:'Cairo',sans-serif;font-size:.78rem;color:#888;line-height:1.7}
/* SUCCESS BROWSE */
.success-browse-wrap{margin-top:18px;display:grid;gap:10px}
.success-browse-btn{display:block;background:var(--yellow);color:var(--black);border:0;border-radius:8px;padding:13px 22px;font-weight:900;font-size:16px;cursor:pointer;font-family:'Cairo',sans-serif;text-decoration:none;text-align:center}
.success-home-btn{display:block;background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;font-family:'Cairo',sans-serif;text-decoration:none;text-align:center;margin-top:6px}
@media(max-width:860px){.product-layout{grid-template-columns:1fr}.gallery{position:static}.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.choice{padding:9px 8px}.choice strong{font-size:14px}.choice span{font-size:11px;margin-top:2px}.option-group{margin-top:9px}.block{padding-top:13px;margin-top:13px}.form{gap:7px}.field input,.field select,.field textarea{padding:9px}.summary{padding:10px;gap:5px;margin-top:10px}.sticky.visible{display:flex}.shell{padding-top:12px;padding-bottom:96px}.topbar{padding-bottom:8px}.prod-stat.offer-stat{padding-top:6px;padding-bottom:10px}.why-grid-p,.how-grid-p{grid-template-columns:1fr}.testi-grid{grid-template-columns:1fr 1fr}}
</style>
<style>
.kids-theme{
  --yellow:#d9b35b;
  --black:#f8f3ea;
  --dark:#fffaf4;
  --line:rgba(104,124,105,.16);
  --muted:#6f7480;
  --red:#b95b74;
  --green:#5b8b79;
  background:
    radial-gradient(circle at 18% 10%, rgba(183,214,186,.44), transparent 26%),
    radial-gradient(circle at 82% 14%, rgba(226,184,205,.42), transparent 24%),
    linear-gradient(180deg, #f7f4ef 0%, #f4f0e9 48%, #f8f3ea 100%);
  color:#2f2f2f;
}
body.kids-theme::before{background:none;opacity:0}
.kids-theme .shell{padding:16px 16px 104px}
.kids-theme .topbar{padding-bottom:16px}
.kids-theme .brand{color:#cbad4e;text-shadow:none}
.kids-theme .back{background:rgba(255,255,255,.7);color:#4d5360;border-color:rgba(104,124,105,.18)}
.kids-hero{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
  align-items:center;
  justify-items:center;
  margin-top:4px;
}
.kids-kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:'Poppins',sans-serif;
  font-weight:700;
  font-size:12px;
  letter-spacing:1.8px;
  text-transform:uppercase;
  color:#7d7a78;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(104,124,105,.12);
  border-radius:999px;
  padding:8px 12px;
  width:fit-content;
}
.kids-hero h1{
  font-family:'Cairo',sans-serif;
  font-size:clamp(34px,6vw,66px);
  line-height:1.02;
  letter-spacing:-.5px;
  color:#2f3b34;
  margin-top:10px;
}
.kids-lead{
  margin-top:10px;
  color:#5f646c;
  line-height:1.9;
  font-size:16px;
  max-width:600px;
}
.kids-price-row{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:10px;
  margin-top:12px;
}
.kids-price{
  font-family:'Poppins',sans-serif;
  font-size:44px;
  font-weight:800;
  color:#deaf28;
}
.kids-old{
  font-family:'Poppins',sans-serif;
  font-size:24px;
  color:#87909b;
  text-decoration:line-through;
}
.kids-chip{
  background:#fff;
  border:1px solid rgba(104,124,105,.15);
  color:#6d5d3a;
  border-radius:999px;
  padding:8px 12px;
  font-family:'Poppins',sans-serif;
  font-size:12px;
  font-weight:700;
}
.kids-hero-card{
  background:linear-gradient(180deg,#fffef9,#eef2e9);
  border:1px solid rgba(104,124,105,.15);
  border-radius:28px;
  padding:14px;
  box-shadow:0 24px 60px rgba(61,75,52,.08);
  width:min(760px,100%);
}
.kids-version-stack{
  margin-top:12px;
}
.kids-mockup{
  background:
    radial-gradient(circle at 50% 20%, rgba(255,255,255,.95), rgba(245,241,232,.88) 52%, rgba(228,236,224,.92) 100%);
  border:1px solid rgba(104,124,105,.14);
  border-radius:22px;
  overflow:hidden;
  aspect-ratio:4/5;
  position:relative;
}
.kids-mockup img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.kids-mockup-tag{
  position:absolute;
  left:18px;
  bottom:18px;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(104,124,105,.12);
  color:#49504c;
  border-radius:999px;
  padding:10px 16px;
  font-family:'Poppins',sans-serif;
  font-size:13px;
  font-weight:700;
  box-shadow:0 10px 20px rgba(77,83,76,.08);
}
.kids-benefits{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-top:16px;
}
.kid-benefit{
  background:rgba(255,255,255,.8);
  border:1px solid rgba(104,124,105,.12);
  border-radius:18px;
  padding:14px 12px;
  min-height:108px;
  box-shadow:0 14px 30px rgba(61,75,52,.05);
}
.kid-benefit .icon{
  font-size:24px;
  margin-bottom:10px;
}
.kid-benefit strong{
  display:block;
  font-family:'Cairo',sans-serif;
  font-size:15px;
  color:#324038;
  line-height:1.4;
}
.kid-benefit span{
  display:block;
  margin-top:6px;
  color:#6a7280;
  font-family:'Poppins',sans-serif;
  font-size:12px;
  line-height:1.6;
}
.kids-panel{
  margin-top:18px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(104,124,105,.14);
  border-radius:28px;
  padding:16px;
  box-shadow:0 18px 40px rgba(61,75,52,.05);
}
.kids-panel-title{
  font-family:'Cairo',sans-serif;
  font-size:28px;
  font-weight:900;
  color:#2f3b34;
  line-height:1.2;
}
.kids-panel-sub{
  margin-top:6px;
  color:#757b85;
  font-family:'Poppins',sans-serif;
  font-size:13px;
}
.kids-order-price{
  margin-top:12px;
}
.kids-product-info{
  margin-top:16px;
}
.kids-product-box{
  background:rgba(255,255,255,.76);
  border:1px solid rgba(104,124,105,.12);

function kidsParseVariantLabel(label){

    else if (!size && kidsLooksLikeSize(part)) size = part;

  if (!version && parts[0]) version = parts[0];
  if (!size && parts[1]) size = parts[1];
  return { version, size };

function kidsVariantData(){

function loadRelated(){
  const col=product?.collection||'';
  const sl=product?.slug||'';
  const section=document.getElementById('related-section');
  const rail=document.getElementById('related-rail');
  if(!section||!rail)return;
  if(!col){section.style.display='none';return;}
  fetch(`${SB_URL}/products?select=slug,name,images,variants,price&active=eq.true&collection=eq.${encodeURIComponent(col)}&limit=12`,{headers:H})
    .then(r=>r.json()).then(data=>{
      if(!Array.isArray(data)){section.style.display='none';return;}
      const items=data.filter(p=>p.slug!==sl).slice(0,6);
      if(!items.length){section.style.display='none';return;}
      rail.innerHTML=items.map(p=>{
        const im=Array.isArray(p.images)?p.images:(p.images?[p.images]:[]);
        const img=im[0]||'';
        const vars=Array.isArray(p.variants)?p.variants:(p.variants&&typeof p.variants==='object'?Object.values(p.variants):[]);
        const minP=vars.length?Math.min(...vars.map(v=>Number(v.price||0)).filter(v=>v>0)):Number(p.price||0);
        return`<a class="rcard" href="/p/${encodeURIComponent(p.slug)}"><div class="rcard-img">${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:''}</div><div class="rcard-info"><div class="rcard-name">${esc(p.name)}</div><div class="rcard-price">${money(minP)}</div></div></a>`;
      }).join('');
    }).catch(()=>{section.style.display='none';});
}

    if(!res.ok)throw new Error(await res.text());

    product=data[0];variant=variants()[0];setDefaultOptions();variant=findSelectedVariant();render();

      window.ARCOMeta.trackViewContent({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:Number(variant.price||product.price||0),currency:'DZD'});

      if(versionImg) mainImg.src=versionImg;
    }
  }else if(variant.image&&document.getElementById('main-img')){
    document.getElementById('main-img').src=variant.image;
  }
  updateTotals();
  updateKidsMeta();
  window.ARCODraft?.triggerCapture?.();
}
function selectDelivery(ev,type){ev.preventDefault();delivery=type;selectedDesk='';ev.currentTarget.parentElement.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));ev.currentTarget.classList.add('active');document.getElementById('commune-wrap').style.display=type==='home'?'grid':'none';document.getElementById('desk-wrap').style.display=type==='pickup'?'grid':'none';if(type==='pickup')loadDesks();updateTotals();window.ARCODraft?.triggerCapture?.();}
async function onWilayaChange(){
  const val=document.getElementById('f-wilaya').value;if(!val)return;selectedDesk='';
  const id=val.split('|')[0];
  populateCommunes(id);
  const res=await fetch(`${SB_URL}/shipping_rates?wilaya_id=eq.${Number(id)}&select=home_delivery,stop_desk&limit=1`,{headers:H});
  const data=await res.json();shipping=data[0]||{home_delivery:0,stop_desk:0};
  document.getElementById('home-price').textContent=money(shipping.home_delivery);
  document.getElementById('desk-price').textContent=money(shipping.stop_desk);
  if(delivery==='pickup')loadDesks();updateTotals();window.ARCODraft?.triggerCapture?.();
}
function populateCommunes(wilayaId){
  const sel=document.getElementById('f-commune');if(!sel)return;
  const communes=WILAYA_COMMUNES[String(wilayaId).padStart(2,'0')]||[];
  sel.innerHTML='<option value="">اختر البلدية</option>'+communes.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('');
}
async function loadDesks(){
  const sel=document.getElementById('f-desk');if(!sel)return;
  if(!desks){try{const r=await fetch('/api/noest-desks');if(r.ok)desks=await r.json();}catch(e){}}
  const id=(document.getElementById('f-wilaya').value||'').split('|')[0];
  const entries=Object.entries(desks||{}).filter(([code])=>id&&new RegExp('^'+id+'[A-Z]').test(code));
  sel.innerHTML='<option value="">اختر النقطة</option>'+entries.map(([code,d])=>`<option value="${code}">${esc(d.name||code)}</option>`).join('');
}
function shippingCost(){return delivery==='home'?Number(shipping.home_delivery||0):Number(shipping.stop_desk||0);}
function total(){return Number(variant.price||0)+shippingCost();}
function updateTotals(){['sum-product','base-price'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=money(variant.price)});const s=document.getElementById('sum-ship'),t=document.getElementById('sum-total'),st=document.getElementById('sticky-total'),sticky=document.getElementById('sticky');if(s)s.textContent=money(shippingCost());if(t)t.textContent=money(total());if(st)st.textContent=money(total());if(sticky)sticky.classList.toggle('visible',!!product);updateStickyCartBadge();if(isKidsProduct())updateKidsMeta();}
function scrollToOrder(){const target=document.getElementById('addcart-btn')||document.getElementById('order-btn')||document.getElementById('order');if(target)target.scrollIntoView({behavior:'smooth',block:'center'});}
function trackProductCheckout(){
  if(checkoutTracked||!window.ARCOMeta||!product)return;
  checkoutTracked=true;
  window.ARCOMeta.trackInitiateCheckout({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD'});
  if(window.ARCOTikTok){
    window.ARCOTikTok.trackInitiateCheckout({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD'});
  }
}
async function submitOrder(){
  const name=document.getElementById('f-name').value.trim(),phone=document.getElementById('f-phone').value.replace(/\s/g,''),wilayaVal=document.getElementById('f-wilaya').value,commune=document.getElementById('f-commune').value.trim();
  const btn=document.getElementById('order-btn');
  const btnAr=btn?.querySelector('.order-btn-ar');
  const btnFr=btn?.querySelector('.order-btn-fr');
  const restoreButton=()=>{ if(btnAr){btnAr.textContent='اطلب الآن';} else if(btn){btn.textContent='اطلب الآن';} if(btnFr){btnFr.textContent='Commander Maintenant';} };
  if(!name)return toast('أدخل الاسم',true);
  if(!/^0[567]\d{8}$/.test(phone))return toast('رقم الهاتف غير صحيح',true);
  if(!wilayaVal)return toast('اختر الولاية',true);
  if(!shippingCost())return toast('اختر ولاية متوفرة',true);
  if(delivery==='home'&&!commune)return toast('اختر البلدية',true);
  if(delivery==='pickup'&&!selectedDesk)return toast('اختر نقطة الاستلام',true);
  trackProductCheckout();
  const [wilayaId,wilaya]=wilayaVal.split('|');
  btn.classList.add('loading');
  if(btnAr){btnAr.textContent='جاري الإرسال...';} else if(btn){btn.textContent='جاري الإرسال...';}
  const payload={product_slug:product.slug,name,phone,wilaya,wilaya_id:Number(wilayaId),commune:delivery==='home'?commune:'',delivery_type:delivery==='home'?'home':'pickup',station_code:delivery==='pickup'?selectedDesk:null,variant_label:variant.label,selected_options:selectedOptions,event_source_url:location.href,attribution:window.ARCOAttribution?.getPayload?.(),draft_order_id:(window.ARCODraft?.getStoredDraftId({product_slug:product.slug,phone,variant_label:variant?.label||variant?.name||'Standard',delivery_type:delivery})||undefined)};
  try{
    const r=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const result=await r.json().catch(()=>({}));
    if(!r.ok||!result.ok)throw new Error(result.error||'failed');
    if(window.ARCOMeta){
      window.ARCOMeta.trackPurchase({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD',eventID:result.order_id});
    }
    if(window.ARCOTikTok){
      window.ARCOTikTok.trackPurchase({content_name:product.name,content_ids:[product.slug],content_category:variant.label,value:total(),currency:'DZD',eventID:result.order_id});
    }
    if(window.ARCODraft){window.ARCODraft.clearStoredDraftId({product_slug:product.slug,phone,variant_label:variant?.label||variant?.name||'Standard',delivery_type:delivery});}
    document.getElementById('success-id').textContent='#'+result.order_id;document.getElementById('success').classList.add('show');
    const phoneBtn = document.getElementById('success-phone-btn');
    const copyToast = document.getElementById('success-copy-toast');
    if (phoneBtn && copyToast) {
      phoneBtn.onclick = async () => {
        const phone = '0550374607';
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(phone);
          } else {
            throw new Error('clipboard unavailable');
          }
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = phone;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.setAttribute('readonly', '');
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        copyToast.classList.add('show');
        clearTimeout(window.__kidsSuccessCopyToastTimer);
        window.__kidsSuccessCopyToastTimer = setTimeout(() => copyToast.classList.remove('show'), 1800);
      };
    }
  }catch(e){btn.classList.remove('loading');restoreButton();const m=(e&&e.message&&e.message!=='failed'&&e.message!=='Failed')?e.message:'حدث خطأ. حاول مرة أخرى';toast(m,true);}
}
let tt;function toast(msg,err=false){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>el.className='toast',2600);}
loadProduct();
</script>
