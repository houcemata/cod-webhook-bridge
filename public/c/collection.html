<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCO | المجموعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Changa:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#F5C500;--bk:#080808;--dk:#111;--dk2:#0d0d0d;--tx:#f4f4f4;--mu:#9a9a9a;--ln:rgba(255,255,255,.07);--ln2:rgba(245,197,0,.22);--sh2:0 8px 32px rgba(0,0,0,.32);--r:18px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--bk);color:var(--tx);font-family:'Changa',sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:min(1240px,calc(100% - 32px));margin:0 auto}

.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px)}
.orb-1{width:480px;height:480px;background:rgba(245,197,0,.05);top:-180px;left:-120px}

/* ANNOUNCE + TOPBAR */
.announce{position:relative;z-index:30;background:var(--bk);border-bottom:1px solid var(--ln);text-align:center;padding:8px 12px}
.announce span{font:700 .78rem/1 'Changa',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--y)}
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(24px);background:rgba(8,8,8,.86);border-bottom:1px solid var(--ln)}
.topbar-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand img{height:40px;width:auto;display:block}
.back-link{font:700 .8rem/1 'Changa',sans-serif;color:var(--mu);padding:8px 16px;border:1px solid var(--ln);border-radius:999px;transition:.2s}
.back-link:hover{border-color:var(--y);color:var(--y)}

/* COLLECTION ICON BAR */
.col-icon-bar{position:sticky;top:68px;z-index:35;background:rgba(8,8,8,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--ln);padding:10px 0}
.col-icon-scroll{display:flex;gap:14px;overflow-x:auto;padding:2px;scrollbar-width:none}
.col-icon-scroll::-webkit-scrollbar{display:none}
.col-icon-item{flex-shrink:0;width:60px;display:grid;justify-items:center;gap:5px;cursor:pointer;background:none;border:none;font-family:'Changa',sans-serif}
.col-icon-circle{width:52px;height:52px;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,rgba(245,197,0,.12),var(--dk2));border:2px solid var(--ln);display:grid;place-items:center;transition:.2s}
.col-icon-circle img{width:100%;height:100%;object-fit:cover}
.col-icon-circle .ph{font:800 1.1rem/1 'Changa',sans-serif;color:var(--y)}
.col-icon-name{font:600 .62rem/1.1 'Changa',sans-serif;color:var(--mu);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-icon-item.active .col-icon-circle{border-color:var(--y);box-shadow:0 0 0 2px rgba(245,197,0,.18)}
.col-icon-item.active .col-icon-name{color:var(--y);font-weight:700}

/* HEADER */
.col-head{position:relative;z-index:1;padding:28px 0 12px;text-align:center}
.col-head h1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(2rem,6vw,3rem);line-height:1}
.col-head .en{display:block;margin-top:8px;font:700 .76rem/1 'Changa',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}

/* TOOLBAR: search + filter toggle */
.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.col-search{flex:1;min-width:200px}
.col-search .search-box{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;border:1px solid var(--ln);background:rgba(255,255,255,.04);transition:.2s}
.col-search .search-box:focus-within{border-color:var(--ln2)}
.col-search .search-box svg{width:17px;height:17px;stroke:var(--mu);flex-shrink:0}
.col-search .search-box input{flex:1;background:none;border:none;outline:none;color:var(--tx);font:600 .9rem/1 'Changa',sans-serif}
.col-search .search-box input::placeholder{color:var(--mu)}

/* SPLIT/SINGLE FILTER */
.split-filter{display:flex;border-radius:999px;border:1.5px solid var(--ln);overflow:hidden;flex-shrink:0}
.split-filter button{padding:9px 18px;background:none;border:none;color:var(--mu);font:700 .8rem/1 'Changa',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap}
.split-filter button.active{background:var(--y);color:#080808}
.split-filter button:not(:last-child){border-left:1.5px solid var(--ln)}

/* SUBCOLLECTION FILTER BAR */
.subbar{display:flex;gap:9px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.subbar::-webkit-scrollbar{display:none}
.subchip{flex-shrink:0;padding:8px 18px;border-radius:999px;border:1.5px solid var(--ln);background:rgba(255,255,255,.03);color:var(--tx);font:600 .86rem/1 'Changa',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap}
.subchip:hover{border-color:var(--ln2)}
.subchip.active{background:var(--y);color:#080808;border-color:var(--y)}

/* PRODUCT GRID */
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:12px;padding:16px 0 10px}
.pcard{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(13,13,13,.96));border:1px solid var(--ln);box-shadow:var(--sh2);transition:.26s}
.pcard:hover{transform:translateY(-6px);border-color:rgba(245,197,0,.38)}
.pthumb{position:relative;aspect-ratio:4/4.8;background:var(--dk2);overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pcard:hover .pthumb img{transform:scale(1.05)}
.poverlay{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:10px;direction:ltr;background:linear-gradient(to top,rgba(8,8,8,.82),rgba(8,8,8,.28) 60%,transparent)}
.pprice{font:800 1.1rem/1 'Changa',sans-serif;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pprice .old{display:block;font:600 .7rem/1 'Changa',sans-serif;color:rgba(255,255,255,.55);text-decoration:line-through;margin-top:3px}
.porder{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--y);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.porder svg{width:16px;height:16px;stroke:#080808;stroke-width:2.4;fill:none}
.split-card .pthumb{aspect-ratio:8/4.8}

.state{position:relative;z-index:1;min-height:40vh;display:grid;place-items:center;text-align:center;color:var(--mu);font-size:1rem}

/* PAGINATION */
.pager{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 0 50px}
.pager button{padding:10px 22px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--tx);font:600 .84rem/1 'Changa',sans-serif;cursor:pointer;transition:.2s}
.pager button:hover:not(:disabled){border-color:var(--y);color:var(--y)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager .info{font:600 .84rem/1 'Changa',sans-serif;color:var(--mu)}

.wa-fab{position:fixed;bottom:20px;left:20px;z-index:50;height:52px;padding:0 18px 0 14px;border-radius:999px;background:#25D366;display:inline-flex;align-items:center;gap:9px;color:#fff;font:800 .94rem/1 'Changa',sans-serif;box-shadow:0 10px 30px rgba(37,211,102,.38);transition:.2s}
.wa-fab:hover{transform:scale(1.05)}
.wa-fab svg{width:26px;height:26px;fill:#fff;flex-shrink:0}

@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .col-head{padding:20px 0 10px}
  .toolbar{gap:8px}
  .split-filter button{padding:8px 12px;font-size:.72rem}
}
@media(hover:none),(pointer:coarse){
  .pcard:hover{transform:none}
  .pcard:hover .pthumb img{transform:none}
  a,button{-webkit-tap-highlight-color:transparent}
}
</style>
<script src="/meta-pixel.js" defer></script>
<script src="/tiktok-pixel.js" defer></script>
</head>
<body>

<div class="orbs" aria-hidden="true"><div class="orb orb-1"></div></div>

<div class="announce"><span>الدفع عند الاستلام — توصيل لجميع الولايات الـ 58 — حق الفحص قبل الدفع</span></div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/" aria-label="ARCO">
      <img src="https://pub-afe21e63db9948a78cf5b43bfa17bcb8.r2.dev/ACRO%20logo%20shopiy-03.png" alt="ARCO" width="130" height="40">
    </a>
    <a class="back-link" href="/">← الرئيسية</a>
  </div>
</header>

<div class="col-icon-bar">
  <div class="wrap"><div class="col-icon-scroll" id="colIconScroll"><div class="state" style="min-height:0;padding:10px;font-size:.8rem">...</div></div></div>
</div>

<section class="col-head wrap">
  <h1 id="col-title">المجموعة</h1>
  <span class="en" id="col-en"></span>
</section>

<div class="wrap">
  <div class="toolbar">
    <div class="col-search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="colSearchInput" type="search" placeholder="ابحث داخل هذه المجموعة..." aria-label="بحث">
      </div>
    </div>
    <div class="split-filter" id="splitFilter" role="group" aria-label="نوع اللوحة">
      <button class="active" onclick="setTypeFilter('all')" id="filterAll">الكل</button>
      <button onclick="setTypeFilter('single')" id="filterSingle">لوحة واحدة</button>
      <button onclick="setTypeFilter('split')" id="filterSplit">سبليت</button>
    </div>
  </div>
  <div class="subbar" id="subbar"></div>
</div>

<div class="wrap">
  <div class="grid" id="grid"><div class="state">جاري التحميل...</div></div>
  <div class="pager" id="pager"></div>
</div>

<a class="wa-fab" href="https://wa.me/213550374607" target="_blank" rel="noreferrer" aria-label="واتساب">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2z"/></svg>
  <span>أحكي معانا</span>
</a>

<script>
const SB='https://mpkpehuatqsubohltssi.supabase.co/rest/v1';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wa3BlaHVhdHFzdWJvaGx0c3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc0NzUsImV4cCI6MjA5NTU3MzQ3NX0.v65rahP8E26xAnbcfOHJToKsja6q_A8v3Kxki8LAymk';
const H={apikey:SK,Authorization:'Bearer '+SK};
const PAGE_SIZE=16;

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const money=v=>Number(v||0).toLocaleString('fr-DZ')+' DZD';
function productUrl(s){return s==='liquid-football'?'/p/liquid-football.html':s==='barber-shop'?'/p/barber-shop.html':'/p/'+encodeURIComponent(s);}
function pImages(p){const b=Array.isArray(p.images)?p.images:(p.images?[p.images]:[]);const v=Array.isArray(p.variants)?p.variants.map(x=>x.image).filter(Boolean):[];return[...new Set([...b,...v])];}
function minPrice(p){const pr=Array.isArray(p.variants)?p.variants.map(v=>Number(v.price||0)).filter(v=>v>0):[];return pr.length?Math.min(...pr):Number(p.price||0);}

let collectionSlug=new URLSearchParams(location.search).get('slug')||(location.pathname.split('/').filter(Boolean)[1]||'');
let collection=null,allItems=[],activeSub='all',typeFilter='all',page=1,searchQuery='';

function cardHTML(p){
  const img=pImages(p)[0];
  const sale=p.original_price&&p.original_price>minPrice(p);
  const isSplit=(p.type||p.product_type||'').toLowerCase().includes('split');
  return`<article class="pcard${isSplit?' split-card':''}">
    <a class="pthumb" href="${productUrl(p.slug)}">
      ${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:''}
      <div class="poverlay">
        <div class="pprice">${money(minPrice(p))}${sale?`<span class="old">${money(p.original_price)}</span>`:''}</div>
        <span class="porder" aria-label="اطلب"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg></span>
      </div>
    </a>
  </article>`;
}

function filteredItems(){
  let list=allItems;
  if(activeSub!=='all')list=list.filter(p=>(p.subcollection||'')===activeSub);
  if(typeFilter==='single')list=list.filter(p=>!(p.type||p.product_type||'').toLowerCase().includes('split'));
  if(typeFilter==='split')list=list.filter(p=>(p.type||p.product_type||'').toLowerCase().includes('split'));
  const q=(searchQuery||'').trim().toLowerCase();
  if(q)list=list.filter(p=>(p.name||'').toLowerCase().includes(q));
  return list;
}

function setTypeFilter(t){
  typeFilter=t;page=1;
  ['filterAll','filterSingle','filterSplit'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(t==='all'?'filterAll':t==='single'?'filterSingle':'filterSplit').classList.add('active');
  renderGrid();
}

function renderSubbar(){
  const bar=document.getElementById('subbar');
  const subs=collection&&Array.isArray(collection.subs)?collection.subs:[];
  if(!subs.length){bar.style.display='none';bar.innerHTML='';return;}
  bar.style.display='';
  const hasAll=subs.some(s=>s.slug==='all');
  const chips=[];
  if(!hasAll)chips.push({slug:'all',name_ar:'الكل'});
  chips.push(...subs);
  bar.innerHTML=chips.map(s=>`<button class="subchip${activeSub===s.slug?' active':''}" onclick="selectSub('${esc(s.slug)}')">${esc(s.name_ar||s.name_en||s.slug)}</button>`).join('');
}

function selectSub(slug){activeSub=slug;page=1;renderSubbar();renderGrid();}

function renderGrid(){
  const grid=document.getElementById('grid');
  const pager=document.getElementById('pager');
  const list=filteredItems();
  if(!list.length){grid.innerHTML='<div class="state">لا توجد تصاميم في هذا القسم حالياً</div>';pager.innerHTML='';return;}
  const totalPages=Math.ceil(list.length/PAGE_SIZE);
  if(page>totalPages)page=totalPages;
  const start=(page-1)*PAGE_SIZE;
  grid.innerHTML=list.slice(start,start+PAGE_SIZE).map(cardHTML).join('');
  pager.innerHTML=totalPages<=1?'':`
    <button onclick="goPage(${page-1})" ${page===1?'disabled':''}>← السابق</button>
    <span class="info">${page} / ${totalPages}</span>
    <button onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}>التالي →</button>`;
}
function goPage(p){page=p;renderGrid();window.scrollTo({top:0,behavior:'smooth'});}

async function load(){
  if(!collectionSlug){document.getElementById('grid').innerHTML='<div class="state">المجموعة غير موجودة</div>';return;}
  try{localStorage.setItem('arco_last_collection',collectionSlug);}catch(e){}
  highlightIconBar();
  try{
    const r=await fetch(`${SB}/collections?select=*&slug=eq.${encodeURIComponent(collectionSlug)}&limit=1`,{headers:H});
    const data=await r.json();
    collection=data[0]||null;
  }catch(e){collection=null;}
  if(collection){
    document.getElementById('col-title').textContent=collection.name_ar||collectionSlug;
    document.getElementById('col-en').textContent=collection.name_en||'';
    document.title='ARCO | '+(collection.name_ar||collectionSlug);
  }else{document.getElementById('col-title').textContent=collectionSlug;}
  activeSub='all';page=1;searchQuery='';typeFilter='all';
  document.getElementById('colSearchInput').value='';
  ['filterAll','filterSingle','filterSplit'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('filterAll').classList.add('active');
  renderSubbar();
  try{
    const r=await fetch(`${SB}/products?select=*&active=eq.true&collection=eq.${encodeURIComponent(collectionSlug)}&order=sort_order.asc,created_at.desc`,{headers:H});
    const data=await r.json();
    allItems=Array.isArray(data)?data:[];
  }catch(e){allItems=[];}
  renderGrid();
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}

let allColsCache=null;
async function loadIconBar(){
  const box=document.getElementById('colIconScroll');
  try{
    if(!allColsCache){
      const r=await fetch(`${SB}/collections?select=*&active=eq.true&order=sort_order.asc`,{headers:H});
      allColsCache=await r.json();
    }
    const cols=Array.isArray(allColsCache)?allColsCache:[];
    if(!cols.length){box.innerHTML='';return;}
    box.innerHTML=cols.map(c=>`
      <button class="col-icon-item" data-slug="${esc(c.slug)}" onclick="switchCollection('${esc(c.slug)}')">
        <div class="col-icon-circle">${c.icon_url?`<img src="${esc(c.icon_url)}" alt="${esc(c.name_ar)}" loading="lazy">`:`<span class="ph">${esc((c.name_en||'A')[0])}</span>`}</div>
        <span class="col-icon-name">${esc(c.name_ar)}</span>
      </button>`).join('');
    highlightIconBar();
  }catch(e){box.innerHTML='';}
}

function highlightIconBar(){
  document.querySelectorAll('.col-icon-item').forEach(el=>{
    const active=el.dataset.slug===collectionSlug;
    el.classList.toggle('active',active);
    if(active)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  });
}

function switchCollection(slug){
  if(!slug||slug===collectionSlug)return;
  collectionSlug=slug;
  history.pushState({collectionSlug:slug},'',`/c/${encodeURIComponent(slug)}`);
  load();
}
window.addEventListener('popstate',e=>{
  const s=e.state?.collectionSlug||location.pathname.split('/').filter(Boolean)[1];
  if(s&&s!==collectionSlug){collectionSlug=s;load();}
});

let _st;
document.getElementById('colSearchInput').addEventListener('input',e=>{
  clearTimeout(_st);_st=setTimeout(()=>{searchQuery=e.target.value;page=1;renderGrid();},180);
});

load();
loadIconBar();
</script>
</body>
</html>
