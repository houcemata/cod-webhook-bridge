<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCO | المجموعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --y:#F5C500;--yd:#c49a00;--bk:#080808;--dk:#111111;--dk2:#0d0d0d;
  --rd:#e11d48;--gn:#22c55e;--tx:#f4f4f4;--mu:#9a9a9a;
  --ln:rgba(255,255,255,.07);--ln2:rgba(245,197,0,.22);
  --sh2:0 8px 32px rgba(0,0,0,.32);--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-height:100vh;background:#080808;color:var(--tx);font-family:'Changa',sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:min(1240px,calc(100% - 32px));margin:0 auto}

.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px)}
.orb-1{width:500px;height:500px;background:rgba(245,197,0,.05);top:-200px;left:-150px}

/* ANNOUNCE + TOPBAR */
.announce{position:relative;z-index:30;background:var(--bk);border-bottom:1px solid var(--ln);text-align:center;padding:9px 12px}
.announce span{font:600 .82rem/1 'Changa',sans-serif;letter-spacing:.06em;color:var(--y)}
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(24px);background:rgba(8,8,8,.84);border-bottom:1px solid var(--ln)}
.topbar-inner{position:relative;z-index:1;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{height:40px;width:auto;display:block;object-fit:contain}
.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--y),#ffd84d);color:#080808;font:800 22px/1 'Changa',sans-serif;flex-shrink:0}
.brand-text strong{display:block;font:800 1.5rem/.95 'Changa',sans-serif;letter-spacing:.04em}
.brand-text span{display:block;font:600 .62rem/1 'Changa',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.back-link{font:600 .82rem/1 'Changa',sans-serif;color:var(--mu);padding:9px 15px;border:1px solid var(--ln);border-radius:999px;transition:.2s}
.back-link:hover{border-color:var(--y);color:var(--y)}

/* HEADER */
.col-head{position:relative;z-index:1;padding:30px 0 14px;text-align:center}
.col-head h1{font:800 clamp(2rem,6vw,3.2rem)/1 'Changa',sans-serif;letter-spacing:.01em}
.col-head .en{display:block;margin-top:8px;font:600 .8rem/1 'Changa',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}

/* COLLECTION ICON BAR (sticky, swaps page content in place) */
.col-icon-bar{position:sticky;top:70px;z-index:35;background:rgba(8,8,8,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--ln);padding:10px 0}
.col-icon-scroll{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 2px;scrollbar-width:none}
.col-icon-scroll::-webkit-scrollbar{display:none}
.col-icon-item{flex-shrink:0;width:62px;display:grid;justify-items:center;gap:5px;cursor:pointer;background:none;border:none;font-family:'Changa',sans-serif}
.col-icon-circle{width:54px;height:54px;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,rgba(245,197,0,.14),var(--dk2));border:2px solid var(--ln);display:grid;place-items:center;transition:.2s}
.col-icon-circle img{width:100%;height:100%;object-fit:cover}
.col-icon-circle .ph{font:800 1.2rem/1 'Changa',sans-serif;color:var(--y)}
.col-icon-name{font:600 .66rem/1.1 'Changa',sans-serif;color:var(--mu);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-icon-item.active .col-icon-circle{border-color:var(--y);box-shadow:0 0 0 2px rgba(245,197,0,.18)}
.col-icon-item.active .col-icon-name{color:var(--y);font-weight:700}

/* SUBCOLLECTION FILTER BAR */
.subbar{position:relative;z-index:1;display:flex;gap:9px;overflow-x:auto;padding:14px 0 8px;scrollbar-width:none}
.col-search{position:relative;z-index:1;margin-top:14px}
.col-search .search-box{width:100%;display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:999px;border:1px solid var(--ln);background:rgba(255,255,255,.04);transition:.2s}
.col-search .search-box:focus-within{border-color:var(--ln2)}
.col-search .search-box svg{width:18px;height:18px;stroke:var(--mu);flex-shrink:0}
.col-search .search-box input{flex:1;background:none;border:none;outline:none;color:var(--tx);font:600 .92rem/1 'Changa',sans-serif}
.col-search .search-box input::placeholder{color:var(--mu)}
.subbar::-webkit-scrollbar{display:none}
.subchip{flex-shrink:0;padding:9px 18px;border-radius:999px;border:1.5px solid var(--ln);background:rgba(255,255,255,.03);color:var(--tx);font:600 .88rem/1 'Changa',sans-serif;cursor:pointer;transition:.2s;white-space:nowrap}
.subchip:hover{border-color:var(--ln2)}
.subchip.active{background:var(--y);color:#080808;border-color:var(--y)}

/* PRODUCT GRID */
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;padding:18px 0 10px}
.pcard{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(13,13,13,.96));border:1px solid var(--ln);box-shadow:var(--sh2);transition:.28s}
.pcard:hover{transform:translateY(-6px);border-color:rgba(245,197,0,.4)}
.pthumb{position:relative;aspect-ratio:4/4.8;background:var(--dk2);overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover;transition:transform .45s}
.pcard:hover .pthumb img{transform:scale(1.05)}
.ppill{position:absolute;top:10px;right:10px;padding:5px 11px;border-radius:999px;background:rgba(8,8,8,.72);border:1px solid rgba(255,255,255,.09);color:var(--y);font:600 .68rem/1 'Changa',sans-serif;letter-spacing:.04em}
.ppill.hot{background:rgba(225,29,72,.18);border-color:rgba(225,29,72,.32);color:#ff7090}
.ppill{display:none}
.pbody{display:none}
/* price + tiny order button overlaid on the bottom of the image */
.poverlay{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:10px;direction:ltr;background:linear-gradient(to top,rgba(8,8,8,.82),rgba(8,8,8,.32) 60%,transparent)}
.pname{display:none}
.pbottom{display:none}
.pprice{font:800 1.1rem/1 'Changa',sans-serif;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.pprice .old{display:block;font:600 .72rem/1 'Changa',sans-serif;color:rgba(255,255,255,.6);text-decoration:line-through;margin-top:3px}
.porder{flex-shrink:0;width:34px;height:34px;padding:0;border-radius:50%;background:var(--y);color:#080808;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.porder svg{width:17px;height:17px;stroke:#080808;stroke-width:2.4;fill:none}

.state{position:relative;z-index:1;min-height:40vh;display:grid;place-items:center;text-align:center;color:var(--mu);font-size:1rem}

/* PAGINATION */
.pager{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 0 50px}
.pager button{padding:11px 22px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--tx);font:600 .85rem/1 'Changa',sans-serif;cursor:pointer;transition:.2s}
.pager button:hover:not(:disabled){border-color:var(--y);color:var(--y)}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager .info{font:600 .85rem/1 'Changa',sans-serif;color:var(--mu)}

.wa-fab{position:fixed;bottom:20px;left:20px;z-index:50;height:52px;padding:0 18px 0 14px;border-radius:999px;background:#25D366;display:inline-flex;align-items:center;gap:9px;color:#fff;font:800 .95rem/1 'Changa',sans-serif;box-shadow:0 10px 30px rgba(37,211,102,.4);transition:.2s}
.wa-fab:hover{transform:scale(1.05)}
.wa-fab svg{width:26px;height:26px;fill:#fff;flex-shrink:0}

@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .col-head{padding:22px 0 10px}
  .pbody{padding:10px}
}
/* ── TOUCH DEVICES: kill movement-hovers so the first tap always lands ── */
@media (hover: none), (pointer: coarse){
  .pcard:hover{transform:none}
  .pcard:hover .pthumb img{transform:none}
  .wa-fab:hover{transform:none}
  a,button{-webkit-tap-highlight-color:transparent}
}
</style>
<script src="/meta-pixel.js"></script>
<script src="/tiktok-pixel.js"></script>
</head>
<body>

<div class="orbs" aria-hidden="true"><div class="orb orb-1"></div></div>

<div class="announce"><span>الدفع عند الاستلام ✓ توصيل لكل ولايات الجزائر</span></div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/" aria-label="ARCO">
      <img class="brand-logo" src="https://pub-afe21e63db9948a78cf5b43bfa17bcb8.r2.dev/ACRO%20logo%20shopiy-03.png" alt="ARCO">
    </a>
    <a class="back-link" href="/">← الرئيسية</a>
  </div>
</header>

<div class="col-icon-bar">
  <div class="wrap"><div class="col-icon-scroll" id="colIconScroll"><div class="state" style="padding:10px">...</div></div></div>
</div>

<section class="col-head wrap">
  <h1 id="col-title">المجموعة</h1>
  <span class="en" id="col-en"></span>
</section>

<div class="wrap">
  <div class="col-search">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="colSearchInput" type="search" placeholder="ابحث داخل هذه المجموعة..." aria-label="بحث">
    </div>
  </div>
</div>

<div class="wrap">
  <div class="subbar" id="subbar"></div>
</div>

<div class="wrap">
  <div class="grid" id="grid"><div class="state">جاري التحميل...</div></div>
  <div class="pager" id="pager"></div>
</div>

<a class="wa-fab" href="https://wa.me/213550374607" target="_blank" rel="noreferrer" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2z"/></svg>
  <span>أحكي معانا</span>
</a>

<script>
const SB_URL='https://mpkpehuatqsubohltssi.supabase.co/rest/v1';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wa3BlaHVhdHFzdWJvaGx0c3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc0NzUsImV4cCI6MjA5NTU3MzQ3NX0.v65rahP8E26xAnbcfOHJToKsja6q_A8v3Kxki8LAymk';
const H={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`};
const PAGE_SIZE=16;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('fr-DZ')+' DZD';}
function productUrl(slug){
  if(slug==='liquid-football')return '/p/liquid-football.html';
  if(slug==='barber-shop')return '/p/barber-shop.html';
  return '/p/'+encodeURIComponent(slug);
}
function pImages(p){
  const base=Array.isArray(p.images)?p.images:(p.images?[p.images]:[]);
  const v=Array.isArray(p.variants)?p.variants.map(x=>x.image).filter(Boolean):[];
  return[...new Set([...base,...v])];
}
function minPrice(p){
  const pr=Array.isArray(p.variants)?p.variants.map(v=>Number(v.price||0)).filter(v=>v>0):[];
  return pr.length?Math.min(...pr):Number(p.price||0);
}

// ── STATE ──
let collectionSlug=new URLSearchParams(location.search).get('slug')||
  (location.pathname.split('/').filter(Boolean)[1]||'');
let collection=null;
let allItems=[];
let activeSub='all';
let page=1;
let searchQuery='';

function cardHTML(p){
  const img=pImages(p)[0];
  const sale=p.original_price&&p.original_price>minPrice(p);
  return`<article class="pcard">
    <a class="pthumb" href="${productUrl(p.slug)}">
      ${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:''}
      <div class="poverlay">
        <div class="pprice">${money(minPrice(p))}${sale?`<span class="old">${money(p.original_price)}</span>`:''}</div>
        <span class="porder" aria-label="اطلب"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></span>
      </div>
    </a>
  </article>`;
}

function filteredItems(){
  let list=allItems;
  if(activeSub!=='all')list=list.filter(p=>(p.subcollection||'')===activeSub);
  const q=(searchQuery||'').trim().toLowerCase();
  if(q)list=list.filter(p=>(p.name||'').toLowerCase().includes(q));
  return list;
}

function renderSubbar(){
  const bar=document.getElementById('subbar');
  const subs=(collection&&Array.isArray(collection.subs))?collection.subs:[];
  if(!subs.length){bar.style.display='none';bar.innerHTML='';return;}
  bar.style.display='';
  // ensure an "all" chip exists first
  const hasAll=subs.some(s=>s.slug==='all');
  const chips=[];
  if(!hasAll)chips.push({slug:'all',name_ar:'الكل'});
  chips.push(...subs);
  bar.innerHTML=chips.map(s=>
    `<button class="subchip ${activeSub===s.slug?'active':''}" onclick="selectSub('${esc(s.slug)}')">${esc(s.name_ar||s.name_en||s.slug)}</button>`
  ).join('');
}

function selectSub(slug){
  activeSub=slug;page=1;
  renderSubbar();renderGrid();
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const pager=document.getElementById('pager');
  const list=filteredItems();
  const total=list.length;
  if(!total){
    grid.innerHTML='<div class="state">لا توجد تصاميم في هذا القسم حالياً</div>';
    pager.innerHTML='';
    return;
  }
  const totalPages=Math.ceil(total/PAGE_SIZE);
  if(page>totalPages)page=totalPages;
  const start=(page-1)*PAGE_SIZE;
  grid.innerHTML=list.slice(start,start+PAGE_SIZE).map(cardHTML).join('');
  pager.innerHTML=totalPages<=1?'':`
    <button onclick="goPage(${page-1})" ${page===1?'disabled':''}>← السابق</button>
    <span class="info">${page} / ${totalPages}</span>
    <button onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}>التالي →</button>`;
}
function goPage(p){page=p;renderGrid();window.scrollTo({top:0,behavior:'smooth'});}

async function load(){
  if(!collectionSlug){document.getElementById('grid').innerHTML='<div class="state">المجموعة غير موجودة</div>';return;}

  try{localStorage.setItem('arco_last_collection',collectionSlug);}catch(e){}
  highlightIconBar();

  // 1) fetch collection meta (title + subs)
  try{
    const r=await fetch(`${SB_URL}/collections?select=*&slug=eq.${encodeURIComponent(collectionSlug)}&limit=1`,{headers:H});
    const data=await r.json();
    collection=data[0]||null;
  }catch(e){collection=null;}

  if(collection){
    document.getElementById('col-title').textContent=collection.name_ar||collectionSlug;
    document.getElementById('col-en').textContent=collection.name_en||'';
    document.title='ARCO | '+(collection.name_ar||collectionSlug);
  }else{
    document.getElementById('col-title').textContent=collectionSlug;
  }
  activeSub='all';page=1;searchQuery='';
  {const si=document.getElementById('colSearchInput');if(si)si.value='';}
  renderSubbar();

  // 2) fetch products in this collection
  try{
    const r=await fetch(`${SB_URL}/products?select=*&active=eq.true&collection=eq.${encodeURIComponent(collectionSlug)}&order=sort_order.asc,created_at.desc`,{headers:H});
    const data=await r.json();
    allItems=Array.isArray(data)?data:[];
  }catch(e){allItems=[];}

  renderGrid();
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}

// ── COLLECTION ICON BAR: sticky row, swaps the whole page in place ──
let allCollectionsCache=null;
async function loadIconBar(){
  const box=document.getElementById('colIconScroll');
  try{
    if(!allCollectionsCache){
      const r=await fetch(`${SB_URL}/collections?select=*&active=eq.true&order=sort_order.asc`,{headers:H});
      allCollectionsCache=await r.json();
    }
    const cols=Array.isArray(allCollectionsCache)?allCollectionsCache:[];
    if(!cols.length){box.innerHTML='';return;}
    box.innerHTML=cols.map(c=>`
      <button class="col-icon-item" data-collection-slug="${esc(c.slug)}" onclick="switchCollection('${esc(c.slug)}')">
        <div class="col-icon-circle">${c.icon_url?`<img src="${esc(c.icon_url)}" alt="${esc(c.name_ar)}">`:`<span class="ph">${esc((c.name_en||'A')[0])}</span>`}</div>
        <span class="col-icon-name">${esc(c.name_ar)}</span>
      </button>`).join('');
    highlightIconBar();
  }catch(e){box.innerHTML='';}
}
function highlightIconBar(){
  document.querySelectorAll('.col-icon-item').forEach(el=>{
    const active=el.dataset.collectionSlug===collectionSlug;
    el.classList.toggle('active',active);
    if(active)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  });
}
// Swaps to a different collection IN PLACE (no full page reload). URL still
// updates via pushState so back/forward and sharing links keep working.
function switchCollection(slug){
  if(!slug||slug===collectionSlug)return;
  collectionSlug=slug;
  history.pushState({collectionSlug:slug},'',`/c/${encodeURIComponent(slug)}`);
  load();
}
window.addEventListener('popstate',(e)=>{
  const fromState=e.state&&e.state.collectionSlug;
  const fromUrl=location.pathname.split('/').filter(Boolean)[1];
  const slug=fromState||fromUrl;
  if(slug&&slug!==collectionSlug){collectionSlug=slug;load();}
});

load();
loadIconBar();

let _colSearchTimer;
document.getElementById('colSearchInput').addEventListener('input',e=>{
  const q=e.target.value;
  clearTimeout(_colSearchTimer);
  _colSearchTimer=setTimeout(()=>{searchQuery=q;page=1;renderGrid();},180);
});
</script>
</body>
</html>
