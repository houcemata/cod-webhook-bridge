<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest-emblg.webmanifest" />
  <link rel="icon" href="https://pub-afe21e63db9948a78cf5b43bfa17bcb8.r2.dev/exec-571b7e34-603b-412a-9949-5d24d6250e33.png" />
  <title>ARCO Emblg</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700;800&display=swap');
    :root{--bg:#020617;--surface:#0b1222;--surface-2:#111b2e;--line:#24324a;--text:#f8fafc;--muted:#9aa8bd;--gold:#f5c500;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--shadow:0 14px 34px rgba(0,0,0,.25)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg)}
    body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% -10%,rgba(245,197,0,.09),transparent 32rem),var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(245,197,0,.55);outline-offset:2px}
    .hidden{display:none!important}
    .login{min-height:100svh;display:grid;place-items:center;padding:24px}
    .login-card{width:min(390px,100%);background:rgba(11,18,34,.94);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
    .brand-lockup{text-align:center;margin-bottom:24px}.brand-lockup img{width:76px;height:76px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 12px 30px rgba(245,197,0,.18)}
    .brand-lockup h1{font:32px Calistoga,serif;letter-spacing:.2px}.brand-lockup p{color:var(--muted);font-size:13px;margin-top:7px}
    .field{display:grid;gap:7px;margin-top:14px}.field label{font-size:12px;font-weight:700;color:var(--muted)}
    .input{width:100%;background:#07101f;border:1px solid var(--line);border-radius:13px;color:var(--text);padding:14px 15px;min-height:48px}.input::placeholder{color:#637188}.input:focus{border-color:var(--gold)}
    .primary{width:100%;min-height:50px;border:0;border-radius:14px;background:var(--gold);color:#080b12;font-weight:800;margin-top:18px;transition:transform .2s,filter .2s}.primary:active{transform:scale(.98)}.primary:hover{filter:brightness(1.06)}
    .error{color:#fca5a5;font-size:13px;min-height:18px;text-align:center;margin-top:12px}
    .app{min-height:100svh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:20;background:rgba(2,6,23,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(36,50,74,.85);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand-mini{display:flex;align-items:center;gap:10px}.brand-mini img{width:40px;height:40px;border-radius:12px}.brand-mini strong{font:20px Calistoga,serif}.brand-mini span{display:block;color:var(--muted);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;margin-top:2px}
    .top-actions{display:flex;gap:8px}.icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);display:grid;place-items:center}.icon-btn svg{width:20px;height:20px}.icon-btn:active{transform:scale(.95)}
    .wrap{width:min(800px,100%);margin:0 auto;padding:16px}.status-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.queue-count{font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    .search-panel{background:rgba(11,18,34,.85);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}.search-label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px}.search-wrap{position:relative}.search-wrap .input{padding-right:44px}.search-icon{position:absolute;right:14px;top:14px;color:var(--muted);width:20px;height:20px}.suggestions{position:absolute;top:calc(100% + 7px);left:0;right:0;background:#101b2f;border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:12;box-shadow:var(--shadow)}.suggestion{width:100%;text-align:left;border:0;border-bottom:1px solid rgba(36,50,74,.7);background:transparent;color:var(--text);padding:13px 14px;display:flex;justify-content:space-between;gap:10px}.suggestion:last-child{border-bottom:0}.suggestion:hover,.suggestion:focus{background:rgba(245,197,0,.1)}.suggestion small{color:var(--muted)}
    .check-row{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;margin-top:11px}.check-row input{width:18px;height:18px;accent-color:var(--gold)}
    .catalog-panel{border-top:1px solid rgba(36,50,74,.8);margin-top:12px;padding-top:12px}.catalog-toggle{border:0;background:none;color:var(--gold);font-size:12px;font-weight:800;padding:0}.catalog-result{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px;background:#07101f;border:1px solid var(--line);border-radius:14px}.catalog-result img{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#162238}.catalog-result strong{font-size:13px}.catalog-result small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
    .order-card{background:linear-gradient(145deg,rgba(17,27,46,.98),rgba(8,15,29,.98));border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.order-head{padding:18px 16px 14px;border-bottom:1px solid rgba(36,50,74,.75);display:flex;justify-content:space-between;gap:16px}.order-head h2{font-size:22px;line-height:1.15}.order-head p{color:var(--muted);font-size:12px;margin-top:6px}.position{color:var(--gold);font:24px Calistoga,serif;white-space:nowrap}.duplicate{margin:12px 16px 0;padding:11px 12px;border-radius:13px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#fbbf24;font-size:12px;line-height:1.45}.group{padding:16px}.group+.group{padding-top:0}.group-title{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--gold);font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:10px}.group-title:after{content:"";height:1px;background:rgba(245,197,0,.25);flex:1}.item{display:flex;align-items:center;gap:12px;background:rgba(2,6,23,.54);border:1px solid rgba(36,50,74,.8);border-radius:15px;padding:10px;margin-bottom:8px;min-height:80px}.item img{width:62px;height:62px;object-fit:cover;border-radius:10px;background:#162238;flex-shrink:0}.item img.no-image{object-fit:contain;padding:15px;opacity:.45}.item-info{min-width:0;flex:1}.item-name{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}.item-meta{font-size:12px;color:var(--muted);margin-top:5px}.item-badge{background:rgba(245,197,0,.12);border:1px solid rgba(245,197,0,.25);color:var(--gold);border-radius:999px;font-size:11px;font-weight:800;padding:5px 8px;white-space:nowrap}
    .empty{display:grid;place-items:center;text-align:center;min-height:260px;background:rgba(11,18,34,.75);border:1px dashed var(--line);border-radius:22px;padding:28px}.empty svg{width:46px;height:46px;color:var(--gold);margin-bottom:12px}.empty h2{font-size:18px}.empty p{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.5}.loading{padding:38px;text-align:center;color:var(--muted)}
    .nav-row{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:12px}.nav-btn{min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);font-weight:700;transition:transform .2s,background .2s}.nav-btn:active{transform:scale(.97)}.nav-btn.done{background:var(--green);border-color:var(--green);color:#03120a}.nav-btn svg{width:18px;height:18px;vertical-align:-4px;margin-right:5px}
    .toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;background:#162238;border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:center;font-size:13px;box-shadow:var(--shadow);transform:translateY(30px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translateY(0)}.toast.error{border-color:rgba(239,68,68,.5);color:#fecaca}
    /* Visual packing grid: two large design previews per row, with the size below each one. */
    .group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px}
    .group+.group{padding-top:0}
    .group-title{grid-column:1/-1;margin-bottom:0;font-size:16px;letter-spacing:2px}
    .item{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;margin:0;padding:8px;border-radius:16px;min-height:0}
    .item img,.item img.no-image{width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;border-radius:12px;padding:0;background:#162238}
    .item-info{width:100%;text-align:center;min-height:38px}
    .item-name{font-size:12px;line-height:1.3}
    .item-meta{display:none}
    .item-badge{width:100%;border:0;background:none;padding:0;text-align:center;font-size:30px;line-height:1;font-weight:800;letter-spacing:1px}
    @media(min-width:700px){.wrap{padding:24px}.topbar{padding-left:24px;padding-right:24px}.item{padding:10px}.item-badge{font-size:34px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <section class="login" id="login-screen">
    <div class="login-card">
      <div class="brand-lockup"><img src="https://pub-afe21e63db9948a78cf5b43bfa17bcb8.r2.dev/exec-571b7e34-603b-412a-9949-5d24d6250e33.png" alt="ARCO Emblg" /><h1>ARCO Emblg</h1><p>Packaging queue</p></div>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" placeholder="name@arco.dz" /></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Your password" /></div>
      <button class="primary" id="login-btn" type="button">Sign in</button><div class="error" id="login-error" role="alert"></div>
    </div>
  </section>

  <main class="app hidden" id="app">
    <header class="topbar"><div class="brand-mini"><img src="https://pub-afe21e63db9948a78cf5b43bfa17bcb8.r2.dev/exec-571b7e34-603b-412a-9949-5d24d6250e33.png" alt="ARCO Emblg" /><div><strong>ARCO Emblg</strong><span>Packaging queue</span></div></div><div class="top-actions"><button class="icon-btn" id="refresh-btn" aria-label="Refresh queue" title="Refresh queue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 0 0-14.8-4L3 10"/><path d="M3 4v6h6"/><path d="M4 13a8 8 0 0 0 14.8 4L21 14"/><path d="M21 20v-6h-6"/></svg></button><button class="icon-btn" id="logout-btn" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg></button></div></header>
    <div class="wrap">
      <div class="status-strip"><div><div class="eyebrow">Next package</div><div style="font-size:13px;color:var(--muted);margin-top:4px">Oldest unarchived order first</div></div><span class="queue-count" id="queue-count">0 active</span></div>
      <section class="search-panel" aria-label="Order search"><label class="search-label" for="customer-search">Find customer</label><div class="search-wrap"><input class="input" id="customer-search" autocomplete="off" placeholder="Start typing a customer name" /><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><div class="suggestions hidden" id="customer-suggestions"></div></div><label class="check-row"><input id="include-archived" type="checkbox" /> Include archived orders in search</label><div class="catalog-panel"><button class="catalog-toggle" id="catalog-toggle" type="button">Search product catalog</button><div class="hidden" id="catalog-tools"><div class="search-wrap" style="margin-top:10px"><input class="input" id="catalog-search" autocomplete="off" placeholder="Type a product name" /><div class="suggestions hidden" id="catalog-suggestions"></div></div><div class="catalog-result hidden" id="catalog-result"></div></div></div></section>
      <div id="content"><div class="loading">Loading packaging queue…</div></div>
      <div class="nav-row hidden" id="nav-row"><button class="nav-btn" id="prev-btn" type="button">‹ Previous</button><button class="nav-btn" id="next-btn" type="button">Next ›</button><button class="nav-btn done" id="done-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>Done</button></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const SB_URL='https://mpkpehuatqsubohltssi.supabase.co';
    const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wa3BlaHVhdHFzdWJvaGx0c3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTc0NzUsImV4cCI6MjA5NTU3MzQ3NX0.v65rahP8E26xAnbcfOHJToKsja6q_A8v3Kxki8LAymk';
    const LOGO='https://pub-afe21e63db9948a78cf5b43bfa17bcb8.r2.dev/exec-571b7e34-603b-412a-9949-5d24d6250e33.png';
    const sb=supabase.createClient(SB_URL,SB_KEY);let user=null,currentUser=null,currentRole=null,rows=[],catalog=[],activeId=null,toastTimer;
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    function showToast(message,error=false){const el=$('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',2800)}
    function sizeOf(item){const raw=String(item?.size||item?.variant||'');if(/^M$/i.test(raw)||/30\s*[×x*]\s*40/i.test(raw))return'M';if(/^L$/i.test(raw)||/40\s*[×x*]\s*60/i.test(raw))return'L';return raw||'Other'}
    function expandedItems(order){const input=Array.isArray(order.items)?order.items:[];const list=input.length?input:[{product:order.product,variant:order.variable,size:sizeOf({variant:order.variable}),image:''}];return list.flatMap(item=>Array.from({length:Math.max(1,Number(item.quantity)||1)},()=>({...item,size:sizeOf(item)})))}
    function sourceDuplicates(row){return rows.filter(x=>x.source_order_id===row.source_order_id)}
    function orderedVisible(){const include=$('include-archived').checked;return rows.filter(x=>include||!x.archived_at).sort((a,b)=>new Date(a.confirmed_at||a.created_at)-new Date(b.confirmed_at||b.created_at)||Number(a.id)-Number(b.id))}
    function currentQueue(){const query=$('customer-search').value.trim().toLowerCase();let list=orderedVisible();if(query)list=list.filter(x=>String(x.customer_name||'').toLowerCase().includes(query));return list}
    function activeRow(){return rows.find(x=>Number(x.id)===Number(activeId))||null}
    function renderCustomerSuggestions(){const q=$('customer-search').value.trim().toLowerCase();const box=$('customer-suggestions');if(!q){box.classList.add('hidden');return}const matches=orderedVisible().filter(x=>String(x.customer_name||'').toLowerCase().includes(q)).slice(0,8);box.innerHTML=matches.length?matches.map(x=>`<button class="suggestion" type="button" data-id="${esc(x.id)}"><span>${esc(x.customer_name)}</span><small>${x.archived_at?'Archived':'Active'}</small></button>`).join(''):'<div class="suggestion"><span>No matching customers</span></div>';box.classList.remove('hidden');box.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{activeId=Number(b.dataset.id);$('customer-search').value=activeRow()?.customer_name||'';box.classList.add('hidden');render()}))}
    function renderOrder(){const row=activeRow();const list=currentQueue();if(!row||!list.some(x=>Number(x.id)===Number(row.id))){activeId=list[0]?.id||null}const current=activeRow();$('queue-count').textContent=`${orderedVisible().filter(x=>!x.archived_at).length} active`;if(!current){$('content').innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m21 8-9-5-9 5 9 5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><h2>No packaging orders</h2><p>Select confirmed orders in the operator app, then tap the ARCO Emblg package icon.</p></div>`;$('nav-row').classList.add('hidden');return}$('nav-row').classList.remove('hidden');const index=list.findIndex(x=>Number(x.id)===Number(current.id));const dup=sourceDuplicates(current);const groups={M:[],L:[],Other:[]};expandedItems(current).forEach(item=>{(groups[item.size]||groups.Other).push(item)});const groupHtml=['M','L','Other'].filter(k=>groups[k].length).map(k=>`<section class="group"><div class="group-title">${k==='Other'?'Other size':`Size ${k}`}</div>${groups[k].map(item=>`<div class="item"><img class="${item.image?'':'no-image'}" src="${esc(item.image||LOGO)}" alt="${esc(item.product||'Product image')}" loading="lazy" /><div class="item-info"><div class="item-name">${esc(item.product||item.product_slug||'Unnamed design')}</div><div class="item-meta">${esc(item.variant||item.size||k)}</div></div><span class="item-badge">${esc(k)}</span></div>`).join('')}</section>`).join('');$('content').innerHTML=`<article class="order-card"><div class="order-head"><div><h2>${esc(current.customer_name)}</h2><p>Order ${esc(current.source_order_key)} · Confirmed ${formatDate(current.confirmed_at||current.created_at)}</p></div><div class="position">${index+1}<span style="font:12px Inter;color:var(--muted)"> / ${list.length}</span></div></div>${dup.length>1?`<div class="duplicate">Duplicate transfer notice: this order was sent ${dup.length} times. Check the other snapshot before packing.</div>`:''}${groupHtml}</article>`;$('prev-btn').disabled=index<=0;$('next-btn').disabled=index>=list.length-1;$('done-btn').disabled=!!current.archived_at}
    function formatDate(value){if(!value)return'—';const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('fr-DZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
    function render(){renderOrder()}
    function move(delta){const list=currentQueue();const i=list.findIndex(x=>Number(x.id)===Number(activeId));const next=list[i+delta];if(next){activeId=next.id;render()}}
    async function done(){const row=activeRow();if(!row||row.archived_at)return;$('done-btn').disabled=true;const r=await sb.from('packaging_orders').update({archived_at:new Date().toISOString()}).eq('id',row.id);if(r.error){$('done-btn').disabled=false;showToast(r.error.message,true);return}row.archived_at=new Date().toISOString();const next=currentQueue().find(x=>!x.archived_at);activeId=next?.id||null;showToast('Order archived');render()}
    async function load(){
      $('content').innerHTML='<div class="loading">Loading packaging queue…</div>';
      const [orders,products]=await Promise.all([sb.from('packaging_orders').select('*').order('confirmed_at',{ascending:true}).order('id',{ascending:true}),sb.from('products').select('name,slug,variants,images').eq('active',true).order('name',{ascending:true})]);
      if(orders.error){$('content').innerHTML=`<div class="empty"><h2>Database setup needed</h2><p>Run <b>supabase-packaging.sql</b> in your Supabase SQL editor, then refresh this page.</p></div>`;showToast(orders.error.message,true);return}
      rows=orders.data||[];catalog=products.data||[];activeId=orderedVisible()[0]?.id||null;render();
    }
    function renderCatalogSuggestions(){const q=$('catalog-search').value.trim().toLowerCase(),box=$('catalog-suggestions');if(!q){box.classList.add('hidden');return}const matches=catalog.filter(p=>String(p.name||'').toLowerCase().includes(q)).slice(0,8);box.innerHTML=matches.length?matches.map(p=>`<button class="suggestion" type="button" data-slug="${esc(p.slug)}"><span>${esc(p.name)}</span><small>Catalog</small></button>`).join(''):'<div class="suggestion"><span>No matching products</span></div>';box.classList.remove('hidden');box.querySelectorAll('[data-slug]').forEach(b=>b.addEventListener('click',()=>showCatalogProduct(catalog.find(p=>p.slug===b.dataset.slug))))}
    function showCatalogProduct(product){if(!product)return;$('catalog-search').value=product.name;$('catalog-suggestions').classList.add('hidden');const variants=Array.isArray(product.variants)?product.variants:Object.values(product.variants||{});const image=variants[0]?.image||(Array.isArray(product.images)?product.images[0]:'')||LOGO;$('catalog-result').innerHTML=`<img src="${esc(image)}" alt="${esc(product.name)}" /><div><strong>${esc(product.name)}</strong><small>${variants.map(v=>esc(v.label||v.name||'Standard')).join(' · ')||'Catalog product'}</small></div>`;$('catalog-result').classList.remove('hidden')}
    async function signIn(){const email=$('email').value.trim(),password=$('password').value;$('login-error').textContent='';$('login-btn').disabled=true;$('login-btn').textContent='Signing in…';const result=await sb.auth.signInWithPassword({email,password});if(result.error){$('login-error').textContent='Invalid email or password';$('login-btn').disabled=false;$('login-btn').textContent='Sign in';return}await start(result.data.user)}
    async function start(nextUser){const role=await sb.from('user_roles').select('role').eq('user_id',nextUser.id).in('role',['operator','admin']).maybeSingle();if(role.error||!role.data){await sb.auth.signOut();$('login-error').textContent='This account is not an operator account.';$('login-btn').disabled=false;$('login-btn').textContent='Sign in';return}user=nextUser;$('login-screen').classList.add('hidden');$('app').classList.remove('hidden');await load()}
    async function ensureOperatorAccess(){const errEl=$('login-error');const{data:roleData,error}=await sb.from('user_roles').select('*').eq('user_id',currentUser.id).in('role',['operator','admin']).single();if(error||!roleData){await sb.auth.signOut();currentUser=null;currentRole=null;$('app').classList.add('hidden');$('login-screen').classList.remove('hidden');errEl.textContent='This account is not an operator account.';return false}currentRole=roleData;return true}
    async function signIn(){const email=$('email').value.trim(),password=$('password').value,errEl=$('login-error'),btn=$('login-btn');if(!email||!password){errEl.textContent='Please enter email and password';return}btn.disabled=true;btn.textContent='Signing in...';errEl.textContent='';const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){errEl.textContent='Invalid email or password';btn.disabled=false;btn.textContent='Sign in';return}currentUser=data.user;const allowed=await ensureOperatorAccess();if(!allowed){btn.disabled=false;btn.textContent='Sign in';return}await showApp()}
    async function showApp(){$('login-screen').classList.add('hidden');$('app').classList.remove('hidden');await load()}
    async function start(nextUser){currentUser=nextUser;$('login-screen').classList.add('hidden');$('app').classList.remove('hidden');await load()}
    async function doLogout(){await sb.auth.signOut();currentUser=null;currentRole=null;$('app').classList.add('hidden');$('login-screen').classList.remove('hidden')}
    $('login-btn').addEventListener('click',signIn);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});$('refresh-btn').addEventListener('click',load);$('logout-btn').addEventListener('click',doLogout);$('prev-btn').addEventListener('click',()=>move(-1));$('next-btn').addEventListener('click',()=>move(1));$('done-btn').addEventListener('click',done);$('customer-search').addEventListener('input',()=>{activeId=currentQueue()[0]?.id||null;renderCustomerSuggestions();render()});$('customer-search').addEventListener('focus',renderCustomerSuggestions);$('include-archived').addEventListener('change',()=>{activeId=currentQueue()[0]?.id||null;renderCustomerSuggestions();render()});$('catalog-toggle').addEventListener('click',()=>{$('catalog-tools').classList.toggle('hidden');$('catalog-search').focus()});$('catalog-search').addEventListener('input',renderCatalogSuggestions);
    window.addEventListener('DOMContentLoaded',async()=>{const{data:{session}}=await sb.auth.getSession();if(session){currentUser=session.user;if(await ensureOperatorAccess())await showApp()}});
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/emblg-sw.js').catch(()=>{});
  </script>
