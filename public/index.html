<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARCO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--yellow:#F5C500;--black:#080808;--panel:#111;--text:#fff;--muted:#b8b8b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--black);color:var(--text);font-family:'Cairo',sans-serif}
a{color:inherit;text-decoration:none}
.topbar{height:68px;background:#101010;display:grid;grid-template-columns:48px 1fr 82px;align-items:center;padding:0 18px;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(255,255,255,.06);direction:ltr}
.icon-btn{width:34px;height:34px;border:0;background:transparent;color:#fff;display:grid;place-items:center;position:relative}
.hamburger,.hamburger:before,.hamburger:after{display:block;width:19px;height:2px;background:#f2f2f2;border-radius:2px;content:""}
.hamburger:before{transform:translateY(-7px)}.hamburger:after{transform:translateY(5px)}
.brand{justify-self:center;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;letter-spacing:1px}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.search-icon{width:19px;height:19px;border:2px solid #fff;border-radius:50%;position:relative}.search-icon:after{content:"";position:absolute;width:8px;height:2px;background:#fff;right:-6px;bottom:-4px;transform:rotate(45deg);border-radius:2px}
.bag{width:21px;height:21px;border:2px solid #fff;border-radius:2px;position:relative}.bag:before{content:"";position:absolute;left:4px;right:4px;top:-8px;height:10px;border:2px solid #fff;border-bottom:0;border-radius:10px 10px 0 0}.cart-badge{position:absolute;right:-8px;bottom:-8px;width:18px;height:18px;border-radius:50%;background:var(--yellow);color:#080808;font-size:11px;font-weight:900;display:grid;place-items:center}
.hero{min-height:388px;background:#1b1b1b center/cover no-repeat;position:relative;display:grid;place-items:center;text-align:center;padding:44px 18px}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.45))}
.hero-content{position:relative;z-index:1;display:grid;justify-items:center;gap:20px}
.hero h1{font-size:clamp(31px,8vw,54px);font-weight:900;line-height:1.25;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.hero .btn{background:var(--yellow);color:#fff;min-width:122px;height:47px;display:inline-grid;place-items:center;font-weight:800}
.wrap{max-width:1120px;margin:0 auto;padding:34px 12px 42px;direction:ltr}
.section-title{font-size:20px;font-weight:900;margin-bottom:24px;direction:ltr;text-align:left}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;direction:ltr}
.product{display:block;min-width:0}
.thumb{position:relative;aspect-ratio:1;background:#eee;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sale{position:absolute;left:12px;bottom:12px;background:#111;color:#fff;border-radius:999px;padding:6px 15px;font-size:12px;font-weight:800}
.info{padding:10px 0 18px;direction:ltr}
.name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;line-height:1.15}
.price{font-family:'Barlow Condensed',sans-serif;color:var(--yellow);font-size:17px;font-weight:800;margin-top:4px}
.empty,.loader,.error{grid-column:1/-1;min-height:190px;display:grid;place-items:center;background:#101010;color:var(--muted);text-align:center;padding:24px}
.footer{border-top:1px solid rgba(255,255,255,.08);padding:22px 14px 34px;text-align:center;color:#858585;font-size:12px;direction:ltr}
@media(min-width:760px){
  .topbar{height:74px;grid-template-columns:80px 1fr 110px;padding:0 28px}
  .hero{min-height:500px}
  .wrap{padding-left:24px;padding-right:24px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .section-title{font-size:24px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" aria-label="Menu"><span class="hamburger"></span></button>
  <a class="brand" href="/">ARCO</a>
  <div class="actions">
    <button class="icon-btn" aria-label="Search"><span class="search-icon"></span></button>
    <button class="icon-btn" aria-label="Cart"><span class="bag"><span class="cart-badge">1</span></span></button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-content">
    <h1>تصفح آخر منتجاتنا</h1>
    <a class="btn" href="#products">تصفح الآن</a>
  </div>
</section>

<main class="wrap" id="products">
  <h2 class="section-title">Featured products</h2>
  <div class="grid" id="products-grid"><div class="loader">Loading products...</div></div>
</main>

<footer class="footer">ARCO - Cash on Delivery - Algeria</footer>

<script>
const SB_URL='https://zcsdkuzmogvpvqjzhnqu.supabase.co/rest/v1';
const SB_KEY='sb_publishable_81QJsFjBfgG9fKhNIS2usA_sNqVQhLF';
const H={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('fr-DZ')+' DZD';}
function productUrl(slug){return slug==='liquid-football'?'/p/liquid-football.html':'/p/'+encodeURIComponent(slug);}
function productImages(p){
  const base=Array.isArray(p.images)?p.images:(p.images?[p.images]:[]);
  const variants=Array.isArray(p.variants)?p.variants.map(v=>v.image).filter(Boolean):[];
  return [...new Set([...base,...variants])];
}
function minVariantPrice(p){
  const prices=Array.isArray(p.variants)?p.variants.map(v=>Number(v.price||0)).filter(Boolean):[];
  return prices.length?Math.min(...prices):Number(p.price||0);
}

async function loadProducts(){
  const grid=document.getElementById('products-grid');
  try{
    const res=await fetch(`${SB_URL}/products?select=*&active=eq.true&order=created_at.asc`,{headers:H});
    if(!res.ok)throw new Error(await res.text());
    const products=await res.json();
    if(!products.length){grid.innerHTML='<div class="empty">قريبا منتجات جديدة.</div>';return;}
    const heroImage=productImages(products[0])[0];
    if(heroImage)document.getElementById('hero').style.backgroundImage=`url("${heroImage}")`;
    grid.innerHTML=products.map(p=>{
      const img=productImages(p)[0];
      return `<a class="product" href="${productUrl(p.slug)}">
        <div class="thumb">${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:''}<span class="sale">Sale</span></div>
        <div class="info">
          <div class="name">${esc(p.name)}</div>
          <div class="price">${money(minVariantPrice(p))}</div>
        </div>
      </a>`;
    }).join('');
  }catch(e){
    grid.innerHTML='<div class="error">تعذر تحميل المنتجات. حاول مرة أخرى لاحقا.</div>';
  }
}
loadProducts();
</script>
</body>
</html>
